{% extends 'index.html' %}

{% block title %}Passwords Chart{% endblock %}

{% block content %}
    <style>
    </style>

    <h2 class="mb-4">Passwords Chart</h2>

    <div class="row">
        <canvas id="passwords-chart" width="400" height="200"></canvas>
        <script>
            const labels = {{ labels|safe }};
            const data = {
                labels: labels,
                datasets: [{
                    label: 'Passwords per day',
                    data: {{ counts|safe }},
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.2,
                    fill: false
                }]
            };

            const config = {
                {#type: 'line',#}
                type: 'bar',
                data: data,
            };

            const passwordsChart = new Chart(
                document.getElementById('passwords-chart'),
                config
            );
        </script>
    </div>
{% endblock %}
