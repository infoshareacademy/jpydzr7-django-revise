services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: django_rest_tutorial_infoshare
      MYSQL_USER: django_user
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    command: >
      sh -c "sleep 5 && python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./:/jpydzr7-django-revise
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=django_rest_tutorial_infoshare
      - DB_USER=django_user
      - DB_PASSWORD=root

volumes:
  mysql_data: